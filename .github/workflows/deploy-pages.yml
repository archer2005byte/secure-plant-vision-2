name: Deploy current site and version archive

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          path: current

      - name: Checkout Version 1
        uses: actions/checkout@v6
        with:
          ref: v1.0.0_17082026
          path: v1

      - name: Checkout Version 2
        uses: actions/checkout@v6
        with:
          ref: v2.0.0_18082026
          path: v2

      - name: Checkout Version 2.1
        uses: actions/checkout@v6
        with:
          ref: archive/v2.1.0_19082026
          path: v21

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: |
            current/package-lock.json
            v1/package-lock.json
            v2/package-lock.json
            v21/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build current site
        working-directory: current
        run: |
          npm ci
          npm run build

      - name: Prepare Version 1 for archive path
        working-directory: v1
        run: |
          sed -i 's#const githubPagesBase = "/secure-plant-vision-2/";#const githubPagesBase = process.env.VITE_PUBLIC_BASE || "/secure-plant-vision-2/";#' vite.config.ts

      - name: Build Version 1
        working-directory: v1
        env:
          VITE_PUBLIC_BASE: /secure-plant-vision-2/versions/v1/
        run: |
          npm ci
          npm run build

      - name: Build Version 2
        working-directory: v2
        env:
          VITE_PUBLIC_BASE: /secure-plant-vision-2/versions/v2/
        run: |
          npm ci
          npm run build

      - name: Build Version 2.1
        working-directory: v21
        env:
          VITE_PUBLIC_BASE: /secure-plant-vision-2/versions/v2.1/
        run: |
          npm ci
          npm run build

      - name: Assemble current site and archive
        shell: bash
        run: |
          mkdir -p site/versions/v1
          mkdir -p site/versions/v2
          mkdir -p site/versions/v2.1

          cp -a current/dist/client/. site/
          cp -a v1/dist/client/. site/versions/v1/
          cp -a v2/dist/client/. site/versions/v2/
          cp -a v21/dist/client/. site/versions/v2.1/

          cat > site/versions/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Secure Plant Vision — Version Archive</title>
            <style>
              body {
                margin: 0;
                padding: 48px;
                font-family: Arial, sans-serif;
                background: #f5f3e9;
                color: #1a1a24;
              }
              main {
                max-width: 760px;
                margin: 0 auto;
              }
              h1 {
                font-size: 36px;
                margin-bottom: 8px;
              }
              p {
                color: #555568;
              }
              .version {
                margin-top: 24px;
                padding: 24px;
                background: white;
                border: 1px solid #d6d6dc;
                border-left: 6px solid #ffe600;
              }
              .version h2 {
                margin: 0 0 6px;
              }
              .current {
                font-weight: 700;
                color: #1a1a24;
              }
              a {
                display: inline-block;
                margin-top: 12px;
                font-weight: 700;
                color: #1a1a24;
              }
            </style>
          </head>
          <body>
            <main>
              <h1>Secure Plant Vision — Version Archive</h1>
              <p>Frozen approved presentation versions.</p>

              <div class="version">
                <h2>Version 2.1</h2>
                <p>19 Aug 2026 · EY laptop fit and Section 02 refinement</p>
                <p class="current">Current approved archived version</p>
                <a href="./v2.1/">Open Version 2.1</a>
              </div>

              <div class="version">
                <h2>Version 2</h2>
                <p>18 Aug 2026</p>
                <a href="./v2/">Open Version 2</a>
              </div>

              <div class="version">
                <h2>Version 1</h2>
                <p>17 Aug 2026</p>
                <a href="./v1/">Open Version 1</a>
              </div>

              <p><a href="../">Return to current version</a></p>
            </main>
          </body>
          </html>
          HTML

          touch site/.nojekyll

          test -f site/index.html
          test -f site/versions/index.html
          test -f site/versions/v1/index.html
          test -f site/versions/v2/index.html
          test -f site/versions/v2.1/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
